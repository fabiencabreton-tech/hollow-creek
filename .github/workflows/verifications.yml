name: Vérifications

# À chaque envoi sur GitHub : installation des dépendances, contrôle des fichiers
# compilés, puis tests automatiques sur SQLite et sur MariaDB 11.8 (comme chez Alwaysdata).
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: racine
          MARIADB_DATABASE: hollow_creek_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, intl, pdo, pdo_mysql, sqlite, pdo_sqlite, gd
          coverage: none

      - name: Installer les dépendances PHP
        id: composer
        run: |
          if [ -f composer.lock ]; then
            composer install --prefer-dist --no-interaction --no-progress
            echo "lock_created=false" >> "$GITHUB_OUTPUT"
          else
            composer update --prefer-dist --no-interaction --no-progress
            echo "lock_created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Compiler le CSS et le JavaScript
        run: |
          npm ci
          npm run build

      - name: Vérifier que les fichiers compilés sont à jour dans le dépôt
        run: |
          if ! git diff --exit-code -- public/build; then
            echo "::error::public/build n'est pas à jour. Lancez « npm run build » et ajoutez le résultat."
            exit 1
          fi

      - name: Préparer l'environnement
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Tests (SQLite)
        run: php artisan test

      - name: Audit d'accessibilité (axe-core, WCAG 2.1 AA)
        env:
          APP_ENV: local
          APP_DEBUG: 'false'
          APP_URL: http://127.0.0.1:8000
          DB_CONNECTION: sqlite
          SESSION_SECURE_COOKIE: 'false'
          MAIL_MAILER: log
          QUEUE_CONNECTION: sync
        run: |
          export DB_DATABASE="$PWD/database/audit.sqlite"
          touch "$DB_DATABASE"
          php artisan migrate --force --seed
          php artisan db:seed --class=AuditSeeder --force
          php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/serve.log 2>&1 &
          npx playwright install --with-deps chromium
          sleep 2
          node tests/accessibilite/captures.mjs || true
          node tests/accessibilite/audit.mjs

      - name: Captures d'écran (branche captures-<branche>, hors main)
        if: always() && github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: |
          [ -d storage/captures ] || exit 0
          cd storage/captures
          git init -q -b captures
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Captures de ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "captures:captures-${GITHUB_REF_NAME}"

      - name: Tests (MariaDB 11.8)
        env:
          DB_CONNECTION: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: hollow_creek_tests
          DB_USERNAME: root
          DB_PASSWORD: racine
        run: php artisan test

      - name: Enregistrer composer.lock dans le dépôt (première fois uniquement)
        if: steps.composer.outputs.lock_created == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "Verrouiller les versions des dépendances PHP (composer.lock)"
          git push
