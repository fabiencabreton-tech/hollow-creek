<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0d1018">
    <title>Hors connexion · Tsukimori</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        :root {
            --bg: #0d1018;
            --text: #ece4d4;
            --muted: #a9b0bf;
            --lantern: #e5ab5c;
            --shu: #a33a25;
            --line: rgba(236, 228, 212, 0.14);
        }
        :root[data-theme='parchemin'] {
            --bg: #f4ecdc;
            --text: #23201b;
            --muted: #5a5348;
            --line: rgba(35, 32, 27, 0.18);
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; min-height: 100%; }
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 32px 20px;
            background:
                radial-gradient(ellipse at 50% 108%, rgba(229, 171, 92, 0.16), transparent 55%),
                var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
        }
        main { max-width: 30rem; text-align: center; }
        .seal { display: block; margin: 0 auto; border-radius: 22px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35); }
        h1 {
            margin: 28px 0 12px;
            font-family: Georgia, 'Times New Roman', serif;
            font-weight: 500;
            font-size: clamp(1.7rem, 6vw, 2.3rem);
            line-height: 1.2;
        }
        p { margin: 0 0 14px; color: var(--muted); }
        .lantern {
            width: 14px;
            height: 20px;
            margin: 26px auto 0;
            border-radius: 4px;
            background: #f6f1e6;
            box-shadow: 0 0 18px 6px rgba(246, 241, 230, 0.35);
        }
        @media (prefers-reduced-motion: no-preference) {
            :root:not([data-motion='reduit']) .lantern { animation: flotte 6s ease-in-out infinite; }
        }
        @keyframes flotte {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        button {
            margin-top: 12px;
            padding: 12px 26px;
            border: 0;
            border-radius: 999px;
            background: var(--shu);
            color: #fbf6ec;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }
        button:focus-visible { outline: 3px solid var(--lantern); outline-offset: 3px; }
        .note { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 0.92rem; }
    </style>
    <script>
        try { if (localStorage.getItem('hollow-creek-theme') === 'parchemin') { document.documentElement.setAttribute('data-theme', 'parchemin'); } } catch (e) {}
        try { if (localStorage.getItem('tsukimori-mouvement') === 'reduit') { document.documentElement.setAttribute('data-motion', 'reduit'); } } catch (e) {}
    </script>
</head>
<body>
    <main>
        <img class="seal" src="/icones/icone-192.png" width="96" height="96" alt="">
        <h1>La brume a coupé la route</h1>
        <p>Pas de connexion pour l’instant : Tsukimori ne peut pas charger cette page.</p>
        <p>Vérifiez le réseau, puis réessayez.</p>
        <button type="button" id="reessayer">Réessayer</button>
        <div class="lantern" aria-hidden="true"></div>
        <p class="note">Un texte en cours d’écriture reste gardé sur cet appareil : vous le retrouverez en revenant sur sa page.</p>
    </main>
    <script>
        document.getElementById('reessayer').addEventListener('click', function () { location.reload(); });
        window.addEventListener('online', function () { location.reload(); });
    </script>
</body>
</html>
